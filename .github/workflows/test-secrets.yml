name: Test Secrets

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check Secrets Configuration
        run: |
          echo "🔍 Checking repository secrets..."
          echo ""
          
          if [ -z "${{ secrets.RELEASE_KEYSTORE_B64 }}" ]; then
            echo "❌ RELEASE_KEYSTORE_B64 - NOT CONFIGURED"
          else
            echo "✅ RELEASE_KEYSTORE_B64 - CONFIGURED"
          fi
          
          if [ -z "${{ secrets.RELEASE_STORE_PASSWORD }}" ]; then
            echo "❌ RELEASE_STORE_PASSWORD - NOT CONFIGURED"
          else
            echo "✅ RELEASE_STORE_PASSWORD - CONFIGURED"
          fi
          
          if [ -z "${{ secrets.RELEASE_KEY_PASSWORD }}" ]; then
            echo "⚠️  RELEASE_KEY_PASSWORD - NOT CONFIGURED (will use RELEASE_STORE_PASSWORD as fallback)"
          else
            echo "✅ RELEASE_KEY_PASSWORD - CONFIGURED"
          fi
          
          if [ -z "${{ secrets.RELEASE_KEY_ALIAS }}" ]; then
            echo "❌ RELEASE_KEY_ALIAS - NOT CONFIGURED"
          else
            echo "✅ RELEASE_KEY_ALIAS - CONFIGURED"
          fi
          
          echo ""
          echo "📊 Summary:"
          MISSING=0
          
          if [ -z "${{ secrets.RELEASE_KEYSTORE_B64 }}" ]; then
            MISSING=$((MISSING + 1))
          fi
          
          if [ -z "${{ secrets.RELEASE_STORE_PASSWORD }}" ]; then
            MISSING=$((MISSING + 1))
          fi
          
          if [ -z "${{ secrets.RELEASE_KEY_ALIAS }}" ]; then
            MISSING=$((MISSING + 1))
          fi
          
          if [ $MISSING -eq 0 ]; then
            echo "✅ All required secrets are configured!"
            exit 0
          else
            echo "❌ $MISSING required secret(s) missing"
            echo ""
            echo "Please configure the following secrets in Settings → Secrets and variables → Actions:"
            echo "  1. RELEASE_KEYSTORE_B64"
            echo "  2. RELEASE_STORE_PASSWORD"
            echo "  3. RELEASE_KEY_ALIAS"
            exit 1
          fi
