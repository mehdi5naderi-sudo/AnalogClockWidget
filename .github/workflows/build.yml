name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle.zip

      - name: Prepare release keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_B64" || { echo "Missing RELEASE_KEYSTORE_B64 secret"; exit 1; }
          echo "$RELEASE_KEYSTORE_B64" | base64 --decode > release.keystore

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PATH: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradle-8.10.2/bin/gradle --no-daemon assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: AnalogClockWidget-release-apk
          path: app/build/outputs/apk/release/app-release.apk
