name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle.zip

      - name: Diagnose signing secrets safely
        env:
          KS: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          SP: ${{ secrets.RELEASE_STORE_PASSWORD }}
          AL: ${{ secrets.RELEASE_KEY_ALIAS }}
          KP: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "RELEASE_KEYSTORE_B64 length: ${#KS}"
          echo "RELEASE_STORE_PASSWORD present: $([ -n "$SP" ] && echo yes || echo no)"
          echo "RELEASE_KEY_ALIAS present: $([ -n "$AL" ] && echo yes || echo no)"
          echo "RELEASE_KEY_PASSWORD present: $([ -n "$KP" ] && echo yes || echo no)"
          test -n "$KS" && test -n "$SP" && test -n "$AL" && test -n "$KP"

      - name: Prepare release keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -e
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > release.keystore

          # Validate the keystore without printing any secret material. Also
          # handle the common case where the two password secrets were swapped.
          printf 'test' > /tmp/signing-data.txt
          jar --create --file /tmp/signing-test.jar /tmp/signing-data.txt >/dev/null 2>&1 || true

          STORE_PASS=''
          KEY_PASS=''
          for S in "$RELEASE_STORE_PASSWORD" "$RELEASE_KEY_PASSWORD"; do
            for K in "$RELEASE_KEY_PASSWORD" "$RELEASE_STORE_PASSWORD"; do
              if keytool -list -keystore release.keystore -storepass "$S" -alias "$RELEASE_KEY_ALIAS" >/dev/null 2>&1 && \
                 jarsigner -keystore release.keystore -storepass "$S" -keypass "$K" -alias "$RELEASE_KEY_ALIAS" /tmp/signing-test.jar >/dev/null 2>&1; then
                STORE_PASS="$S"
                KEY_PASS="$K"
                break 2
              fi
            done
          done

          if [ -z "$STORE_PASS" ]; then
            echo "ERROR: The supplied keystore cannot be opened with the configured store/key passwords and alias."
            echo "No new signing key was generated; the existing installed app is not affected."
            exit 1
          fi

          echo "Signing keystore, alias, and private-key password validated successfully."
          {
            echo "RELEASE_STORE_PASSWORD=$STORE_PASS"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PATH: release.keystore
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: ./gradle-8.10.2/bin/gradle --no-daemon assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: AnalogClockWidget-release-apk
          path: app/build/outputs/apk/release/app-release.apk
