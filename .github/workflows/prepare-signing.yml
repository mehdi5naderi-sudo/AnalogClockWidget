name: Prepare signing keystore

on:
  push:
    paths:
      - '.github/workflows/prepare-signing.yml'
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate canonical keystore
        env:
          STORE_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$STORE_PASS" ] || [ -z "$KEY_PASS" ]; then
            echo "ERROR: RELEASE_STORE_PASSWORD and RELEASE_KEY_PASSWORD secrets must be configured."
            exit 1
          fi
          keytool -genkeypair -v \
            -keystore release.keystore \
            -storetype PKCS12 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -alias analogclock \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname 'CN=Analog Clock Widget, OU=Personal, O=Mehdi, L=Private, S=Private, C=FI'
          base64 -w 0 release.keystore > release.keystore.b64

      - name: Upload canonical signing package
        uses: actions/upload-artifact@v4
        with:
          name: AnalogClockWidget-signing-canonical
          path: |
            release.keystore
            release.keystore.b64
          retention-days: 7
