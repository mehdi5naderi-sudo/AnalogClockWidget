name: Prepare signing keystore

on:
  push:
    paths:
      - '.github/workflows/prepare-signing.yml'
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate canonical keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -storetype PKCS12 \
            -storepass 'AnalogClockStore2026!' \
            -keypass 'AnalogClockKey2026!' \
            -alias analogclock \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname 'CN=Analog Clock Widget, OU=Personal, O=Mehdi, L=Private, S=Private, C=FI'
          base64 -w 0 release.keystore > release.keystore.b64

      - name: Upload canonical signing package
        uses: actions/upload-artifact@v4
        with:
          name: AnalogClockWidget-signing-canonical
          path: |
            release.keystore
            release.keystore.b64
          retention-days: 7
